[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "peak-alphaloop"
version = "1.0.0"
description = "Simple video tool: remove black, white or green-screen backgrounds to alpha, make seamless mirror loops, and do basic multi-clip edits"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Peak Projections", email = "jesse@peakprojections.com" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "scipy>=1.11",
]
keywords = ["video", "alpha", "chroma key", "green screen", "transparent", "webm", "prores", "loop"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video :: Conversion",
    "Environment :: Web Environment",
]

[project.urls]
Homepage = "https://github.com/peakprojections/peak-alphaloop"
Issues = "https://github.com/peakprojections/peak-alphaloop/issues"

[project.scripts]
alphaloop = "peak_alphaloop.server:main"
alphaloop-cli = "peak_alphaloop.cli:main"

[tool.setuptools.packages.find]
include = ["peak_alphaloop*"]

[tool.setuptools.package-data]
peak_alphaloop = ["static/*"]
