name: Build downloads

# Push a tag like v1.2.0 to build every platform and publish a GitHub Release.
# Run it by hand ("Run workflow") to test-build chosen platforms without releasing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (comma separated: windows, macos, linux)"
        default: "windows,macos,linux"
        required: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        shell: python
        env:
          REQUESTED: ${{ github.event.inputs.platforms || 'windows,macos,linux' }}
        run: |
          import json, os
          runners = {"windows": "windows-latest", "macos": "macos-14", "linux": "ubuntu-22.04"}
          wanted = [p.strip() for p in os.environ["REQUESTED"].split(",") if p.strip() in runners]
          include = [{"platform": p, "os": runners[p]} for p in wanted]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps({"include": include}) + "\n")

  build:
    needs: plan
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: python -m pip install --upgrade pip && python -m pip install . pyinstaller certifi

      - name: Build standalone app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python packaging/build_standalone.py

      - name: Upload download
        uses: actions/upload-artifact@v4
        with:
          name: download-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect downloads
        uses: actions/download-artifact@v4
        with:
          pattern: download-*
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: sha256sum PeakAlphaloop-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Peak Alphaloop ${GITHUB_REF_NAME#v}" \
            --generate-notes
