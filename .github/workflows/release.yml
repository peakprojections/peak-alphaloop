name: Build downloads

# Publish a GitHub Release with a tag like v1.2.0 (Releases -> Draft a new release ->
# choose/create the tag -> Publish). This builds every platform and attaches the
# downloads plus SHA256SUMS.txt to that release.
# Run it by hand ("Run workflow") to test-build chosen platforms without releasing.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (comma separated: windows, macos, macos-intel, linux)"
        default: "windows,macos,macos-intel,linux"
        required: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        shell: python
        env:
          REQUESTED: ${{ github.event.inputs.platforms || 'windows,macos,macos-intel,linux' }}
        run: |
          import json, os
          # macos-15-intel is GitHub's last Intel Mac runner (supported until about August 2027).
          runners = {"windows": "windows-latest", "macos": "macos-15",
                     "macos-intel": "macos-15-intel", "linux": "ubuntu-22.04"}
          wanted = [p.strip() for p in os.environ["REQUESTED"].split(",") if p.strip() in runners]
          include = [{"platform": p, "os": runners[p]} for p in wanted]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps({"include": include}) + "\n")

  build:
    needs: plan
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: python -m pip install --upgrade pip && python -m pip install . pyinstaller certifi

      - name: Build standalone app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python packaging/build_standalone.py

      - name: Upload download
        uses: actions/upload-artifact@v4
        with:
          name: download-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect downloads
        uses: actions/download-artifact@v4
        with:
          pattern: download-*
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: sha256sum PeakAlphaloop-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Attach downloads to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
